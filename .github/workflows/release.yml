name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Extract version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (tests + binary)
        if: steps.check_tag.outputs.exists == 'false'
        run: bun run build

      - name: Cross-compile macOS (ARM)
        if: steps.check_tag.outputs.exists == 'false'
        run: bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile weather-cli-darwin-arm64

      - name: Cross-compile macOS (Intel)
        if: steps.check_tag.outputs.exists == 'false'
        run: bun build --compile --target=bun-darwin-x64 src/index.ts --outfile weather-cli-darwin-amd64

      - name: Cross-compile Windows
        if: steps.check_tag.outputs.exists == 'false'
        run: bun build --compile --target=bun-windows-x64 src/index.ts --outfile weather-cli-windows-amd64.exe

      - name: Rename Linux binary
        if: steps.check_tag.outputs.exists == 'false'
        run: mv weather-cli weather-cli-linux-amd64

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            weather-cli-linux-amd64
            weather-cli-darwin-arm64
            weather-cli-darwin-amd64
            weather-cli-windows-amd64.exe
